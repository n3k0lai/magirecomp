name: Decomp report

# Builds the matching Magi Nation (USA) disassembly in decomp/ and uploads the
# objdiff progress report (out/report.json) for decomp trackers. The ROM is
# never in the repository: it comes from Actions secrets (legacy single
# BASEROM_B64, or chunked BASEROM_B64_1..N + BASEROM_B64_PARTS), is checked
# against the retail SHA-1, and is deleted before the artifact upload.

on:
  push:
    branches: [master]
    paths:
      - "decomp/**"
      - ".github/workflows/decomp-report.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: decomp
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore the retail ROM from the Actions secret
        env:
          BASEROM_B64: ${{ secrets.BASEROM_B64 }}
          BASEROM_B64_PARTS: ${{ secrets.BASEROM_B64_PARTS }}
          BASEROM_B64_1: ${{ secrets.BASEROM_B64_1 }}
          BASEROM_B64_2: ${{ secrets.BASEROM_B64_2 }}
          BASEROM_B64_3: ${{ secrets.BASEROM_B64_3 }}
          BASEROM_B64_4: ${{ secrets.BASEROM_B64_4 }}
          BASEROM_B64_5: ${{ secrets.BASEROM_B64_5 }}
          BASEROM_B64_6: ${{ secrets.BASEROM_B64_6 }}
          BASEROM_B64_7: ${{ secrets.BASEROM_B64_7 }}
          BASEROM_B64_8: ${{ secrets.BASEROM_B64_8 }}
          BASEROM_B64_9: ${{ secrets.BASEROM_B64_9 }}
          BASEROM_B64_10: ${{ secrets.BASEROM_B64_10 }}
          BASEROM_B64_11: ${{ secrets.BASEROM_B64_11 }}
          BASEROM_B64_12: ${{ secrets.BASEROM_B64_12 }}
          BASEROM_B64_13: ${{ secrets.BASEROM_B64_13 }}
          BASEROM_B64_14: ${{ secrets.BASEROM_B64_14 }}
          BASEROM_B64_15: ${{ secrets.BASEROM_B64_15 }}
          BASEROM_B64_16: ${{ secrets.BASEROM_B64_16 }}
          BASEROM_B64_17: ${{ secrets.BASEROM_B64_17 }}
          BASEROM_B64_18: ${{ secrets.BASEROM_B64_18 }}
          BASEROM_B64_19: ${{ secrets.BASEROM_B64_19 }}
          BASEROM_B64_20: ${{ secrets.BASEROM_B64_20 }}
          BASEROM_B64_21: ${{ secrets.BASEROM_B64_21 }}
          BASEROM_B64_22: ${{ secrets.BASEROM_B64_22 }}
          BASEROM_B64_23: ${{ secrets.BASEROM_B64_23 }}
          BASEROM_B64_24: ${{ secrets.BASEROM_B64_24 }}
          BASEROM_B64_25: ${{ secrets.BASEROM_B64_25 }}
          BASEROM_B64_26: ${{ secrets.BASEROM_B64_26 }}
          BASEROM_B64_27: ${{ secrets.BASEROM_B64_27 }}
          BASEROM_B64_28: ${{ secrets.BASEROM_B64_28 }}
          BASEROM_B64_29: ${{ secrets.BASEROM_B64_29 }}
          BASEROM_B64_30: ${{ secrets.BASEROM_B64_30 }}
          BASEROM_B64_31: ${{ secrets.BASEROM_B64_31 }}
          BASEROM_B64_32: ${{ secrets.BASEROM_B64_32 }}
          BASEROM_B64_33: ${{ secrets.BASEROM_B64_33 }}
          BASEROM_B64_34: ${{ secrets.BASEROM_B64_34 }}
          BASEROM_B64_35: ${{ secrets.BASEROM_B64_35 }}
          BASEROM_B64_36: ${{ secrets.BASEROM_B64_36 }}
          BASEROM_B64_37: ${{ secrets.BASEROM_B64_37 }}
          BASEROM_B64_38: ${{ secrets.BASEROM_B64_38 }}
          BASEROM_B64_39: ${{ secrets.BASEROM_B64_39 }}
          BASEROM_B64_40: ${{ secrets.BASEROM_B64_40 }}
          BASEROM_B64_41: ${{ secrets.BASEROM_B64_41 }}
          BASEROM_B64_42: ${{ secrets.BASEROM_B64_42 }}
          BASEROM_B64_43: ${{ secrets.BASEROM_B64_43 }}
          BASEROM_B64_44: ${{ secrets.BASEROM_B64_44 }}
          BASEROM_B64_45: ${{ secrets.BASEROM_B64_45 }}
          BASEROM_B64_46: ${{ secrets.BASEROM_B64_46 }}
          BASEROM_B64_47: ${{ secrets.BASEROM_B64_47 }}
          BASEROM_B64_48: ${{ secrets.BASEROM_B64_48 }}
          BASEROM_B64_49: ${{ secrets.BASEROM_B64_49 }}
          BASEROM_B64_50: ${{ secrets.BASEROM_B64_50 }}
          BASEROM_B64_51: ${{ secrets.BASEROM_B64_51 }}
          BASEROM_B64_52: ${{ secrets.BASEROM_B64_52 }}
          BASEROM_B64_53: ${{ secrets.BASEROM_B64_53 }}
          BASEROM_B64_54: ${{ secrets.BASEROM_B64_54 }}
          BASEROM_B64_55: ${{ secrets.BASEROM_B64_55 }}
          BASEROM_B64_56: ${{ secrets.BASEROM_B64_56 }}
          BASEROM_B64_57: ${{ secrets.BASEROM_B64_57 }}
          BASEROM_B64_58: ${{ secrets.BASEROM_B64_58 }}
          BASEROM_B64_59: ${{ secrets.BASEROM_B64_59 }}
          BASEROM_B64_60: ${{ secrets.BASEROM_B64_60 }}
          BASEROM_B64_61: ${{ secrets.BASEROM_B64_61 }}
          BASEROM_B64_62: ${{ secrets.BASEROM_B64_62 }}
          BASEROM_B64_63: ${{ secrets.BASEROM_B64_63 }}

        run: |
          set -euo pipefail
          mkdir -p roms
          if [ -n "${BASEROM_B64:-}" ]; then
            printf '%s' "$BASEROM_B64" | base64 -d > roms/magination.gbc
          else
            if [ -z "${BASEROM_B64_PARTS:-}" ]; then
              echo "Set BASEROM_B64 (small ROM) or BASEROM_B64_PARTS + BASEROM_B64_1..N. The report will not take a ROM from the tree." >&2
              exit 1
            fi
            for i in $(seq 1 "$BASEROM_B64_PARTS"); do
              eval "chunk=\$BASEROM_B64_$i"
              if [ -z "$chunk" ]; then
                echo "missing BASEROM_B64_$i" >&2
                exit 1
              fi
              printf '%s' "$chunk"
            done | base64 -d > roms/magination.gbc
          fi
          echo "9972a7bca43210b4b6c0b3f6ee5d1957a865e12d  roms/magination.gbc" | sha1sum -c -

      - name: Match the retail image and write the report
        run: nix develop --command make report

      - name: Keep the cartridge image out of the artifact
        run: |
          set -euo pipefail
          test -s out/report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("out/report.json").read_text())
          if report.get("version") != 2:
              raise SystemExit("report.json is not objdiff report version 2")
          blob = Path("out/report.json").read_bytes()
          rom = Path("roms/magination.gbc").read_bytes()
          if rom[:256] in blob or rom[0x104:0x134] in blob:
              raise SystemExit("report.json contains ROM bytes")
          PY
          rm -f roms/magination.gbc out/magination.gbc out/magination.o

      - uses: actions/upload-artifact@v4
        with:
          name: usa_report
          path: decomp/out/report.json
          if-no-files-found: error

name: Decomp report

# Builds the matching Magi Nation (USA) disassembly in decomp/ and uploads the
# objdiff progress report (out/report.json) for decomp trackers. The ROM is
# never in the repository: it comes from the BASEROM_B64 Actions secret, is
# checked against the retail SHA-1, and is deleted before the artifact upload.

on:
  push:
    branches: [master]
    paths:
      - "decomp/**"
      - ".github/workflows/decomp-report.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: decomp
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore the retail ROM from the Actions secret
        env:
          BASEROM_B64: ${{ secrets.BASEROM_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${BASEROM_B64}" ]; then
            echo "BASEROM_B64 is unset. The report needs the retail image and will not take one from the tree." >&2
            exit 1
          fi
          mkdir -p roms
          printf '%s' "$BASEROM_B64" | base64 -d > roms/magination.gbc
          echo "9972a7bca43210b4b6c0b3f6ee5d1957a865e12d  roms/magination.gbc" | sha1sum -c -

      - name: Match the retail image and write the report
        run: nix develop --command make report

      - name: Keep the cartridge image out of the artifact
        run: |
          set -euo pipefail
          test -s out/report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("out/report.json").read_text())
          if report.get("version") != 2:
              raise SystemExit("report.json is not objdiff report version 2")
          blob = Path("out/report.json").read_bytes()
          rom = Path("roms/magination.gbc").read_bytes()
          if rom[:256] in blob or rom[0x104:0x134] in blob:
              raise SystemExit("report.json contains ROM bytes")
          PY
          rm -f roms/magination.gbc out/magination.gbc out/magination.o

      - uses: actions/upload-artifact@v4
        with:
          name: usa_report
          path: decomp/out/report.json
          if-no-files-found: error
